<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevKit - API Debugger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span>DevKit</span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn active" data-panel="history">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        History
      </button>
      <button class="nav-btn" data-panel="collections">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Collections
      </button>
    </nav>
    <!-- Panel content loaded dynamically -->
    <div id="panel-content" class="panel-content"></div>
  </aside>

  <!-- Main -->
  <main id="main">
    <!-- Request Builder -->
    <section id="request-section">
      <div class="request-bar">
        <div class="method-select-wrapper">
          <select id="method-select" class="method-select">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
            <option value="PATCH">PATCH</option>
            <option value="HEAD">HEAD</option>
            <option value="OPTIONS">OPTIONS</option>
          </select>
        </div>
        <input id="url-input" class="url-input" type="text" placeholder="https://api.example.com/endpoint" autocomplete="off" spellcheck="false">
        <button id="send-btn" class="btn btn-send">Send</button>
        <button id="save-btn" class="btn btn-secondary" title="Save to collection">Save</button>
      </div>

      <div class="request-tabs">
        <button class="tab-btn active" data-tab="headers">Headers</button>
        <button class="tab-btn" data-tab="body">Body</button>
        <button class="tab-btn" data-tab="params">Params</button>
      </div>

      <div id="tab-headers" class="tab-panel">
        <div id="headers-list" class="kv-list"></div>
        <button id="add-header-btn" class="btn btn-add">+ Add Header</button>
      </div>
      <div id="tab-body" class="tab-panel hidden">
        <textarea id="body-editor" class="body-editor" placeholder='{"key": "value"}' spellcheck="false"></textarea>
      </div>
      <div id="tab-params" class="tab-panel hidden">
        <div id="params-list" class="kv-list"></div>
        <button id="add-param-btn" class="btn btn-add">+ Add Param</button>
      </div>
    </section>

    <!-- Response Viewer -->
    <section id="response-section" class="response-section">
      <div class="response-meta">
        <div class="response-meta-left">
          <span id="status-badge" class="status-badge hidden"></span>
          <span id="duration-text" class="meta-text"></span>
          <span id="size-text" class="meta-text"></span>
          <span id="error-text" class="error-text hidden"></span>
        </div>
      </div>
      <div class="response-tabs">
        <button class="tab-btn active" data-rtab="body">Body</button>
        <button class="tab-btn" data-rtab="headers">Headers</button>
        <button class="tab-btn" data-rtab="raw">Raw</button>
      </div>
      <div id="rtab-body" class="rtab-panel">
        <div class="response-toolbar">
          <button id="copy-response-btn" class="btn btn-toolbar" title="Copy response">Copy</button>
          <button id="format-response-btn" class="btn btn-toolbar" title="Format JSON">Format</button>
        </div>
        <pre id="response-body-view" class="response-body"></pre>
      </div>
      <div id="rtab-headers" class="rtab-panel hidden">
        <div id="response-headers-view" class="response-headers"></div>
      </div>
      <div id="rtab-raw" class="rtab-panel hidden">
        <pre id="response-raw-view" class="response-body"></pre>
      </div>
    </section>
  </main>
</div>

<!-- Collection save modal -->
<div id="save-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3>Save to Collection</h3>
      <button id="save-modal-close" class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Collection</label>
        <select id="collection-select"></select>
      </div>
      <div class="form-group">
        <label>Request Name</label>
        <input id="save-request-name" type="text" placeholder="My Request">
      </div>
      <div class="form-actions">
        <button id="save-confirm-btn" class="btn btn-send">Save</button>
        <button id="save-cancel-btn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
